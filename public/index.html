  <style>
    .help-tour.guided-tour{position:fixed;inset:0;z-index:300;display:block;padding:0;background:transparent;pointer-events:none}

<body>
  <header class="topbar">
    <div class="brand-group"><a class="brand" href="#" aria-label="Rabbi Joey Soffer Shiurim home"><img class="brand-mark" src="icon-rjs-v36-192.png?v=45" alt="RJS Torah"><span>RABBI JOEY SOFFER SHIURIM</span></a><button id="shareAppBtn" class="ghost-btn" type="button" hidden>Share app</button></div>
    <div class="top-actions"><button id="installBtn" class="ghost-btn" type="button" hidden>Download app</button><a class="contact-rabbi" href="mailto:joeysoffer@gmail.com?subject=Message%20from%20RJS%20Torah%20app" aria-label="Email Rabbi Joey Soffer">Contact Rabbi Joey</a><button id="helpBtn" class="ghost-btn" type="button"><span aria-hidden="true">?</span> Help</button><button id="refreshBtn" class="ghost-btn" type="button"><span aria-hidden="true">↻</span> Refresh feeds</button></div>
  </header>
  <main>
    <section class="hero">
      <h1>Rabbi Joey Soffer<br><em>Shiurim</em></h1>
      <div class="feed-row" hidden style="display:none">
        <input id="feedInput" type="url" aria-label="Podcast RSS feed" placeholder="Paste an RSS feed URL">
        <button id="addFeedBtn" class="primary-btn" type="button">Add feed</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="library" aria-labelledby="libraryTitle">
      <div class="library-heading">
        <div><p class="eyebrow">LIBRARY</p><h2 id="libraryTitle">Latest episodes</h2></div>
        <span id="episodeCount" class="count">0 episodes</span>
      </div>
      <div class="tools">
        <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search episodes" aria-label="Search episodes"></label>
        <select id="sortSelect" aria-label="Sort episodes">
          <option value="date-desc">Date · newest first</option><option value="date-asc">Date · oldest first</option>
          <option value="file-asc">File name · A to Z</option><option value="file-desc">File name · Z to A</option>
          <option value="title-asc">Title · A to Z</option><option value="title-desc">Title · Z to A</option>
          <option value="favorites-desc">★ Favorites only</option>
        </select>
      </div>
      <div id="episodeList" class="episode-list"><div class="empty">Fetching your podcast…</div></div>
    </section>
  </main>

  <aside id="player" class="player" aria-label="Audio player">
    <div class="now-playing"><div id="playerArt" class="mini-art">RJS</div><div><span class="mini-label">NOW PLAYING</span><div class="player-title-row"><strong id="playerTitle">Choose an episode</strong><div class="player-episode-actions"><button id="playerFavoriteBtn" type="button" disabled>☆ Favorite</button><button id="playerDownloadBtn" type="button" disabled>Download</button><button id="playerShareBtn" type="button" disabled>Share</button></div></div><span id="playerShow">Rabbi Joey Soffer Shiurim</span></div></div>
    <div class="transport">
      <div class="buttons"><button id="backBtn" aria-label="Back 15 seconds">↶<small>15</small></button><button id="playBtn" class="play" aria-label="Play">▶</button><button id="forwardBtn" aria-label="Forward 30 seconds">↷<small>30</small></button></div>
      <div class="timeline"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Playback position"><span id="duration">0:00</span></div>
    </div>
    <label class="speed">SPEED<select id="speedSelect" aria-label="Playback speed"><option>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select></label>
  </aside>
  <audio id="audio" preload="metadata"></audio>
  <div id="installHelp" class="install-help" hidden><strong>Install Rabbi Joey Soffer Shiurim</strong><p id="installHelpText"></p><button id="closeInstallHelp" type="button">Got it</button></div>
  <div id="helpTour" class="help-tour guided-tour" hidden>
    <div class="guided-blocker" aria-hidden="true"></div>
    <div id="helpSpotlight" class="guided-spotlight" aria-hidden="true"></div>
    <section id="helpTooltip" class="guided-tooltip" role="dialog" aria-modal="true" aria-labelledby="helpTitle" aria-describedby="helpText">
      <div id="helpArrow" class="guided-arrow" aria-hidden="true"></div>
      <header class="guided-head"><span id="helpStep" class="help-kicker">1 OF 7</span><button id="helpClose" class="help-close" type="button" aria-label="Close help">×</button></header>
      <h2 id="helpTitle">Your Shiurim Library</h2>
      <p id="helpText"></p>
      <div id="helpDots" class="help-dots" aria-label="Help pages"></div>
      <footer class="guided-foot"><button id="helpBack" class="help-nav" type="button">Back</button><span>Swipe for more</span><button id="helpNext" class="help-nav" type="button">Next</button></footer>
    </section>
  </div>
  <script type="module" src="app.js?v=93"></script>
</body></html>
