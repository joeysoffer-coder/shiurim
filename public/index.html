<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17140f"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RJS Torah">
  <title>Rabbi Joey Soffer Shiurim</title><link rel="manifest" href="manifest.webmanifest?v=44"><link rel="apple-touch-icon" sizes="180x180" href="icon-rjs-v36-180.png?v=37">
  <link rel="stylesheet" href="styles.css?v=56">
  <style>.availability{display:block;font-size:10px;font-weight:800;letter-spacing:1px;color:#777064;margin-bottom:7px}.availability.is-downloaded{color:#23734d}.download-btn,.share-episode-btn{margin-top:10px;border:1px solid #17140f;background:transparent;padding:7px 10px;font-weight:700;cursor:pointer}.share-episode-btn{margin-left:6px}.download-btn:disabled{opacity:.5;cursor:wait}.todays-classes{margin-bottom:38px;border:2px solid #d85a32;background:#fff8ec;padding:0 18px 8px}.today-heading{display:flex;align-items:end;justify-content:space-between;padding:22px 0 14px}.today-heading h3{font:36px Georgia,serif;margin:4px 0}.today-heading>span{font-size:12px;color:#777064}@media(max-width:760px){.download-btn,.share-episode-btn{padding:8px 12px}.now-playing{display:flex!important;max-width:100%;width:100%;padding-bottom:4px}.now-playing .mini-art{width:42px;height:42px}.now-playing strong{font-size:14px}.player{min-height:205px}body{padding-bottom:calc(220px + env(safe-area-inset-bottom))}.todays-classes{padding:0 10px 6px}.today-heading h3{font-size:29px}.top-actions{gap:4px}.top-actions .ghost-btn{padding:8px 7px;font-size:10px}}</style>
  <style>.folder-grid{grid-auto-rows:180px}.folder-card{height:180px;min-height:180px}.folder-card strong{white-space:normal;overflow-wrap:anywhere;line-height:1.15}@media(max-width:760px){.folder-grid{grid-auto-rows:165px}.folder-card{height:165px;min-height:165px}}</style>
  <style>.favorite-btn{margin:10px 0 0 6px;border:1px solid #17140f;background:transparent;padding:7px 10px;font-weight:700;cursor:pointer}.favorite-btn.is-favorite{background:#17140f;color:#fffaf0}@media(max-width:760px){.favorite-btn{padding:8px 12px}}</style>
  <style>.episode-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;align-items:center;margin-top:9px;width:100%}.episode-actions .favorite-btn,.episode-actions .download-btn,.episode-actions .share-episode-btn{margin:0;padding:5px 4px;font-size:10px;line-height:1.1;min-height:28px;min-width:0;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:760px){.episode-actions{gap:3px}.episode-actions .favorite-btn,.episode-actions .download-btn,.episode-actions .share-episode-btn{padding:5px 3px;font-size:9px}}</style>
  <style>.topbar{gap:12px}.brand{min-width:0;flex-shrink:1}.brand-mark{width:44px!important;height:44px!important;border-radius:12px!important;object-fit:cover;flex:0 0 44px}.top-actions{align-items:center;flex-shrink:0}.top-actions #installBtn,.top-actions #shareAppBtn{background:#d85a32;color:#fff;border-color:#d85a32;border-radius:999px;padding:11px 16px;font-size:12px;box-shadow:0 4px 12px #d85a3233}.top-actions #refreshBtn{border-color:#d8d0c1;border-radius:999px;padding:8px 10px;font-size:10px;color:#595246}@media(max-width:560px){.topbar{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}.brand span:last-child{display:none}.top-actions #installBtn,.top-actions #shareAppBtn{padding:10px 13px;font-size:11px}.top-actions #refreshBtn{padding:8px;font-size:0}.top-actions #refreshBtn span{font-size:17px}.brand-mark{width:42px!important;height:42px!important;flex-basis:42px}}</style>
  <style>.speed{display:flex;align-items:center;gap:8px}.speed select{margin-left:0!important;background:#f5f0e5!important;color:#17140f!important;border:1px solid #d8d0c1!important;border-radius:999px;padding:7px 28px 7px 11px!important;font-weight:800;box-shadow:0 3px 10px #0002;min-height:34px;cursor:pointer}.speed select:focus{outline:2px solid #d85a32;outline-offset:2px}</style>
  <style>.player-episode-actions{display:flex;gap:4px;margin-top:7px}.player-episode-actions button{border:1px solid #6b6257;background:transparent;color:#f5f0e5;border-radius:5px;padding:4px 6px;font-size:9px;font-weight:800;white-space:nowrap}.player-episode-actions button.is-favorite{background:#d85a32;border-color:#d85a32}.player-episode-actions button:disabled{opacity:.45}@media(max-width:760px){.player-episode-actions{gap:3px}.player-episode-actions button{padding:4px 5px;font-size:9px}}</style>
  <style>.library-heading{scroll-margin-top:calc(84px + env(safe-area-inset-top))}</style>
  <style>.speed{gap:5px!important}.speed select{width:62px!important;min-height:28px!important;height:28px!important;padding:3px 18px 3px 8px!important;font-size:11px!important;line-height:1!important;box-shadow:none!important}</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Rabbi Joey Soffer Shiurim home"><img class="brand-mark" src="icon-rjs-v36-192.png?v=45" alt="RJS Torah"><span>RABBI JOEY SOFFER SHIURIM</span></a>
    <div class="top-actions"><button id="installBtn" class="ghost-btn" type="button" hidden>Download app</button><button id="shareAppBtn" class="ghost-btn" type="button" hidden>Share app</button><button id="refreshBtn" class="ghost-btn" type="button"><span aria-hidden="true">↻</span> Refresh feeds</button></div>
  </header>
  <main>
    <section class="hero">
      <h1>Rabbi Joey Soffer<br><em>Shiurim</em></h1>
      <div class="feed-row" hidden style="display:none">
        <input id="feedInput" type="url" aria-label="Podcast RSS feed" placeholder="Paste an RSS feed URL">
        <button id="addFeedBtn" class="primary-btn" type="button">Add feed</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="library" aria-labelledby="libraryTitle">
      <div class="library-heading">
        <div><p class="eyebrow">LIBRARY</p><h2 id="libraryTitle">Latest episodes</h2></div>
        <span id="episodeCount" class="count">0 episodes</span>
      </div>
      <div class="tools">
        <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search episodes" aria-label="Search episodes"></label>
        <select id="sortSelect" aria-label="Sort episodes">
          <option value="date-desc">Date · newest first</option><option value="date-asc">Date · oldest first</option>
          <option value="file-asc">File name · A to Z</option><option value="file-desc">File name · Z to A</option>
          <option value="title-asc">Title · A to Z</option><option value="title-desc">Title · Z to A</option>
          <option value="favorites-desc">★ Favorites only</option>
        </select>
      </div>
      <div id="episodeList" class="episode-list"><div class="empty">Fetching your podcast…</div></div>
    </section>
  </main>

  <aside id="player" class="player" aria-label="Audio player">
    <div class="now-playing"><div id="playerArt" class="mini-art">RJS</div><div><span class="mini-label">NOW PLAYING</span><strong id="playerTitle">Choose an episode</strong><span id="playerShow">Rabbi Joey Soffer Shiurim</span><div class="player-episode-actions"><button id="playerFavoriteBtn" type="button" disabled>☆ Favorite</button><button id="playerDownloadBtn" type="button" disabled>Download</button><button id="playerShareBtn" type="button" disabled>Share</button></div></div></div>
    <div class="transport">
      <div class="buttons"><button id="backBtn" aria-label="Back 15 seconds">↶<small>15</small></button><button id="playBtn" class="play" aria-label="Play">▶</button><button id="forwardBtn" aria-label="Forward 30 seconds">↷<small>30</small></button></div>
      <div class="timeline"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Playback position"><span id="duration">0:00</span></div>
    </div>
    <label class="speed">SPEED<select id="speedSelect" aria-label="Playback speed"><option>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select></label>
  </aside>
  <audio id="audio" preload="metadata"></audio>
  <div id="installHelp" class="install-help" hidden><strong>Install Rabbi Joey Soffer Shiurim</strong><p id="installHelpText"></p><button id="closeInstallHelp" type="button">Got it</button></div>
  <script type="module" src="app.js?v=56"></script>
</body></html>
